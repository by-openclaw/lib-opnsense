[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opnsense"
version = "0.1.0"
description = "Async Python library for OPNsense REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "BY-SYSTEMS", email = "engineering@by-systems.be"}]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]
container = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
vault = ["hvac>=2.1", "python-dotenv>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/opnsense"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
markers = [
    "integration: requires live OPNsense device",
    "smoke: no network needed",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/opnsense"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
targets = ["src/"]
skips = ["B101"]
