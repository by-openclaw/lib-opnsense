---
# Playbook: Auth scope integration test
# Tests: auth_user, auth_group, auth_priv
# Usage: ansible-playbook playbooks/playbook_auth.yml --check (dry-run)

- name: OPNsense Auth integration test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    opn_host: "{{ lookup('env', 'OPN_HOST') }}"
    opn_key: "{{ lookup('env', 'OPN_KEY') }}"
    opn_secret: "{{ lookup('env', 'OPN_SECRET') }}"
  tasks:
    - name: Ensure test group exists
      opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        name: grp-test-automation
        description: "Test group for CI"
        state: present
      register: group_result

    - name: Ensure test user exists
      opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        name: svc-test-automation
        email: "test@by-systems.be"
        group_memberships: "grp-test-automation"
        state: present
      register: user_result

    - name: Show results
      debug:
        msg: "group={{ group_result }}, user={{ user_result }}"

    - name: Cleanup — remove test user
      opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        name: svc-test-automation
        state: absent

    - name: Cleanup — remove test group
      opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        name: grp-test-automation
        state: absent
