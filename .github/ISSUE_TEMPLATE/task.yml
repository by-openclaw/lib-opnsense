name: Task
description: Approved work item from NEEDS.md or sprint plan
labels: ["task"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - feat — new feature
        - fix — bug fix
        - docs — documentation
        - chore — maintenance / refactor
        - security — hardening
    validations:
      required: true

  - type: input
    id: needs-ref
    attributes:
      label: NEEDS.md / sprint reference
      description: Which item does this implement?
      placeholder: "H11, M5, sprint-2026-04-02, etc."
    validations:
      required: true

  - type: dropdown
    id: assigned
    attributes:
      label: Assigned to
      options:
        - "@by-rune"
        - "@by-opus"
        - "@yboujraf"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical — blocks deployment
        - high — needed this sprint
        - medium — needed this phase
        - low — backlog
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of work
      description: What exactly needs to be done? Be specific.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      description: How do we know this is complete? Testable criteria.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files / repos affected
      description: List the files or repos this task touches.
      placeholder: |
        - platform-setup/tools/vault/docs/setup.md
        - infra-terraform-proxmox/environments/poc/main.tf
    validations:
      required: false
