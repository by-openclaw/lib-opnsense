name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical — service down or data loss
        - high — feature broken, workaround exists
        - medium — incorrect behavior, low impact
        - low — cosmetic or edge case
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component / tool
      description: Which tool or service is affected?
      placeholder: "vault, authentik, terraform, etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. Include error messages.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Run `terraform plan`
        2. See error: "..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: VM name, tool version, OS, etc.
      placeholder: |
        VM: vm-vault-poc-01
        Tool: Vault 1.18
        OS: Debian 12
    validations:
      required: false
