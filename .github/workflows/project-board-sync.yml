name: Add to Project Board

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          github-token: ${{ secrets.RUNE_GITHUB_TOKEN }}
          project-url: https://github.com/orgs/by-openclaw/projects/2
