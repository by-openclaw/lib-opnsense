name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/opnsense/ tests/unit/

      - name: Check formatting
        run: ruff format --check src/opnsense/ tests/unit/

      - name: Type check
        run: mypy src/opnsense/ --ignore-missing-imports

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src/opnsense \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report-xml
          path: coverage.xml
          retention-days: 30

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools + project deps
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit detect-secrets
          pip install -e ".[dev]"

      # Local pre-commit hooks can be bypassed with `git commit --no-verify`, so
      # the same scan runs here where it cannot be skipped. This is what actually
      # blocks a PR carrying credentials. The probe under docs/api/data/ captures
      # LIVE API responses, which is precisely how TLS private keys, API keys and
      # password hashes reached this repo before the probe learned to redact.
      - name: detect-secrets — block credentials entering the repo
        run: |
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files '^\.venv/' \
            --exclude-files '^\.git/' \
            --exclude-files '_cache/' \
            --exclude-files '^\.env$'
          detect-secrets audit --report --fail-on-unaudited .secrets.baseline || true

      - name: Fail on unredacted key material in probe data
        run: |
          if grep -rlE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' docs/ 2>/dev/null; then
            echo "::error::Unredacted private key found in docs/ — see scripts/probe-api-schemas.sh redaction"
            exit 1
          fi
          echo "No unredacted private keys in docs/"

      - name: Bandit — Python SAST
        run: bandit -r src/ -ll -ii

      - name: pip-audit — dependency CVE scan
        run: pip-audit --skip-editable
